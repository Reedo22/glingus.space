<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>glingus.space</title>
  <link rel="icon" href="icons/computer.svg">
  <link rel="stylesheet" href="lib/98.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>

<!--
  HOW TO EDIT THIS PAGE
  =====================
  Every window is one <section class="app"> block below. The desktop icon,
  Start menu entry, title bar and taskbar button are all generated from it:

    data-title   text on the title bar, icon and taskbar
    data-icon    picture from the icons/ folder (computer, folder, notepad,
                 film, info) - or any image path
    data-open    "yes" = window is already open when the page loads
    data-width   starting width in pixels (optional, default 360)

  To add a window: copy a whole <section> ... </section> block, change its
  attributes, and write normal HTML inside <div class="window-body">.

  A desktop icon that just opens a website (no window) is an <a> instead:
    <a class="app" data-title="Jellyfin" data-icon="film"
       href="https://play.glingus.space:8443"></a>

  Controls you can use inside windows (buttons, fieldsets, tabs, text boxes,
  tree views, progress bars...) are all shown at https://jdan.github.io/98.css/
-->

<main id="desktop">

  <section class="app" data-title="Welcome" data-icon="info" data-open="yes" data-width="380">
    <div class="window-body">
      <p><b>Welcome to glingus.space!</b></p>
      <p>Double-click an icon on the desktop, or use the Start menu.</p>
      <fieldset>
        <legend>Around here</legend>
        <ul class="tree-view">
          <li><a href="https://play.glingus.space:8443">play.glingus.space</a> - Jellyfin</li>
        </ul>
      </fieldset>
      <section class="field-row" style="justify-content: flex-end">
        <button data-close>OK</button>
      </section>
    </div>
  </section>

  <section class="app" data-title="My Computer" data-icon="computer">
    <div class="window-body">
      <p>This is glingus.space.</p>
      <p>Put whatever you like in here.</p>
    </div>
  </section>

  <section class="app" data-title="Projects" data-icon="folder" data-width="420">
    <div class="window-body">
      <ul class="tree-view">
        <li>Projects
          <ul>
            <li>Something cool</li>
            <li>Something else cool</li>
          </ul>
        </li>
      </ul>
    </div>
  </section>

  <section class="app" data-title="Notepad" data-icon="notepad" data-width="400">
    <div class="window-body">
      <textarea rows="10" style="width: 100%; box-sizing: border-box">Type something...</textarea>
    </div>
  </section>

  <a class="app" data-title="Jellyfin" data-icon="film" href="https://play.glingus.space:8443"></a>

</main>

<footer class="taskbar">
  <button class="start-button" aria-haspopup="menu" aria-expanded="false">
    <img src="icons/start.svg" alt=""><b>Start</b>
  </button>
  <div class="taskbar-divider"></div>
  <div class="taskbar-tasks"></div>
  <div class="taskbar-tray status-bar-field"><span class="clock"></span></div>
</footer>

<nav class="start-menu window" hidden>
  <div class="start-menu-banner"><b>glingus</b>.space</div>
  <ul class="start-menu-items"></ul>
</nav>

<script src="desktop.js"></script>
</body>
</html>
